<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyperact</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="palette">
    <div class="query">
      <div class="drag-handle" id="drag-handle" aria-label="Drag Hyperact">
        <svg class="query-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m13.8 4.2-7.6 8.3h5.6l-1.6 7.3 7.6-9h-5.5l1.5-6.6Z"/>
        </svg>
      </div>
      <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="Type or paste anything…" aria-label="Hyperact input">
      <span id="kind" class="kind"></span>
    </div>

    <div id="actions" class="actions" role="listbox"></div>

    <footer id="footer" class="footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> run</span>
      <span><kbd>esc</kbd> clear</span>
    </footer>
  </main>
</body>
</html>
