<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyperact</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="command-preview.css">
  <script src="app.js" defer></script>
  <script src="command-preview.js" defer></script>
  <script src="file-search.js" defer></script>
</head>
<body>
  <main class="palette">
    <div class="query">
      <div class="drag-handle" id="drag-handle" aria-label="Drag Hyperact">
        <svg class="query-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m13.8 4.2-7.6 8.3h5.6l-1.6 7.3 7.6-9h-5.5l1.5-6.6Z"/>
        </svg>
      </div>
      <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="Search apps and actions…" aria-label="Hyperact input">
      <span id="kind" class="kind"></span>
    </div>

    <div id="actions" class="actions" role="listbox"></div>
    <div id="scroll-thumb" class="scroll-thumb" aria-hidden="true"></div>

    <div id="item-actions" class="item-actions-popover" hidden>
      <div class="item-actions-head">
        <span id="item-actions-title" class="item-actions-title"></span>
        <span id="item-actions-hint" class="item-actions-hint"></span>
      </div>
      <div id="item-actions-list" class="item-actions-list" role="listbox"></div>
      <div class="item-actions-search-wrap">
        <span>⌕</span>
        <input id="item-actions-search" class="item-actions-search" type="text" autocomplete="off" spellcheck="false" placeholder="Search for actions…">
      </div>
    </div>

    <section id="command-editor" class="command-editor" hidden>
      <aside class="command-sidebar">
        <div class="command-sidebar-head">
          <span>Commands</span>
          <button id="command-new" class="editor-icon-button" type="button" aria-label="New command" title="New command">+</button>
        </div>
        <div id="command-list" class="command-list"></div>
      </aside>

      <div class="command-detail">
        <div class="command-primary-row">
          <input id="command-name" class="command-name" type="text" autocomplete="off" spellcheck="false" placeholder="Command name">
          <input id="command-match" class="command-hotkey command-match" type="text" autocomplete="off" spellcheck="false" placeholder="Input pattern (regex)" title="Optional regular expression. Matching launcher text can run this command directly.">
          <input id="command-hotkey" class="command-hotkey" type="text" autocomplete="off" spellcheck="false" placeholder="Press shortcut" readonly title="Click, then press a shortcut. Enter accepts, Escape cancels, Backspace clears.">
        </div>

        <div class="command-options">
          <div class="command-option">
            <span>Input</span>
            <div id="command-input-mode" class="segmented" data-value="focused">
              <button type="button" data-value="focused">Focused</button>
              <button type="button" data-value="selected">Selected</button>
            </div>
          </div>

          <div class="command-option">
            <span>No text</span>
            <div id="command-missing-input" class="segmented" data-value="prompt">
              <button type="button" data-value="prompt">Prompt</button>
              <button type="button" data-value="nothing">Nothing</button>
            </div>
          </div>

          <div class="command-option">
            <span>Output</span>
            <div id="command-output-mode" class="segmented" data-value="type">
              <button type="button" data-value="type">Type</button>
              <button type="button" data-value="paste">Paste</button>
            </div>
          </div>
        </div>

        <div id="command-workbench" class="command-workbench">
          <div id="command-code-pane" class="command-code-pane">
            <div class="command-code-head">
              <span>Node.js</span>
              <span><code>input</code> → return value</span>
            </div>
            <textarea id="command-code" class="command-code" spellcheck="false" placeholder="return input;"></textarea>
          </div>

          <div id="command-resizer" class="command-resizer" title="Drag to resize · double-click to reset"></div>

          <div class="command-preview">
            <div class="command-preview-head">
              <span>Test</span>
              <button id="command-preview-run" class="command-preview-run" type="button">Run</button>
            </div>
            <div class="command-preview-grid">
              <label class="command-preview-field">
                <span>Input</span>
                <textarea id="command-example-input" class="command-example-input" spellcheck="false">hello</textarea>
              </label>
              <div class="command-preview-field">
                <span>Output</span>
                <pre id="command-example-output" class="command-example-output empty">Run to preview</pre>
              </div>
            </div>
          </div>
        </div>

        <div class="command-bottom">
          <button id="command-delete" class="editor-button danger" type="button">Delete</button>
          <div id="command-status" class="command-status"></div>
          <button id="command-cancel" class="editor-button" type="button">Close</button>
          <button id="command-save" class="editor-button primary" type="button">Save</button>
        </div>
      </div>
    </section>

    <footer id="footer" class="footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> run</span>
      <span><kbd>esc</kbd> back</span>
    </footer>
  </main>
</body>
</html>
