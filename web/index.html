<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyperact</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="palette">
    <div class="query">
      <div class="drag-handle" id="drag-handle" aria-label="Drag Hyperact">
        <svg class="query-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m13.8 4.2-7.6 8.3h5.6l-1.6 7.3 7.6-9h-5.5l1.5-6.6Z"/>
        </svg>
      </div>
      <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="Search apps and actions…" aria-label="Hyperact input">
      <span id="kind" class="kind"></span>
    </div>

    <div id="actions" class="actions" role="listbox"></div>
    <div id="scroll-thumb" class="scroll-thumb" aria-hidden="true"></div>

    <section id="command-editor" class="command-editor" hidden>
      <div class="command-editor-head">
        <select id="command-select" aria-label="Command to edit"></select>
        <button id="command-new" class="editor-button" type="button">New</button>
      </div>

      <label class="editor-field">
        <span>Name</span>
        <input id="command-name" type="text" autocomplete="off" spellcheck="false" placeholder="Hash">
      </label>

      <label class="editor-field">
        <span>Hotkey <small>optional</small></span>
        <input id="command-hotkey" type="text" autocomplete="off" spellcheck="false" placeholder="Ctrl+Shift+H">
      </label>

      <label class="editor-field editor-code-field">
        <span>Node.js</span>
        <textarea id="command-code" spellcheck="false" placeholder="return input;"></textarea>
      </label>

      <div class="editor-help"><code>input</code> is your text. Return the replacement. <code>require()</code>, Node built-ins, and <code>await</code> work.</div>
      <div id="command-status" class="command-status"></div>

      <div class="command-editor-actions">
        <button id="command-delete" class="editor-button danger" type="button">Delete</button>
        <span></span>
        <button id="command-cancel" class="editor-button" type="button">Cancel</button>
        <button id="command-save" class="editor-button primary" type="button">Save</button>
      </div>
    </section>

    <footer id="footer" class="footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> run</span>
      <span><kbd>esc</kbd> back</span>
    </footer>
  </main>

  <script>
    const actionList = document.querySelector("#actions");
    const scrollThumb = document.querySelector("#scroll-thumb");
    let scrollFadeTimer;

    function updateScrollThumb() {
      if (actionList.hidden || actionList.scrollHeight <= actionList.clientHeight) {
        scrollThumb.hidden = true;
        return;
      }

      scrollThumb.hidden = false;
      const inset = 5;
      const trackHeight = actionList.clientHeight - inset * 2;
      const thumbHeight = Math.max(24, trackHeight * actionList.clientHeight / actionList.scrollHeight);
      const maxScroll = actionList.scrollHeight - actionList.clientHeight;
      const travel = trackHeight - thumbHeight;
      const y = maxScroll ? travel * actionList.scrollTop / maxScroll : 0;

      scrollThumb.style.height = `${thumbHeight}px`;
      scrollThumb.style.top = `${actionList.offsetTop + inset + y}px`;
    }

    function showScrollThumb() {
      updateScrollThumb();
      if (scrollThumb.hidden) return;

      scrollThumb.classList.add("visible");
      clearTimeout(scrollFadeTimer);
      scrollFadeTimer = setTimeout(() => scrollThumb.classList.remove("visible"), 650);
    }

    actionList.addEventListener("scroll", showScrollThumb, { passive: true });
    new ResizeObserver(updateScrollThumb).observe(actionList);
    new MutationObserver(updateScrollThumb).observe(actionList, { childList: true, subtree: true });

    window.addEventListener("blur", () => {
      window.__TAURI__.window.getCurrentWindow().hide();
    });
  </script>
</body>
</html>
